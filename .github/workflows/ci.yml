name: ci

# PR / push 门禁（REQUIREMENTS.md §21 / G4 #34）。
#
# `check` 跑仓库的单一本地门禁 `pnpm check`：Rust fmt/clippy/test + 前端 lint/tsc/vitest +
# 四道校验（i18n 中文字面量、i18n key 结构一致、git check-ignore 保真度、specta 生成物无 diff）
# + 前端许可审计。
# `licenses` 单独跑 Rust 许可审计（cargo-deny），与平台无关。
on:
  push:
    branches: [main, dev]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # 长路径（§21）：Windows 上 Rust 目标目录很容易超过 MAX_PATH。
      - name: Enable git long paths
        run: git config --global core.longpaths true

      - uses: pnpm/action-setup@v4
        with:
          version: 12.4.2

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          cache-on-failure: true

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Gates (rust + frontend + four checks + npm licenses)
        run: pnpm check

  licenses:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check licenses
