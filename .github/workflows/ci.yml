name: ci

# PR / push 门禁（REQUIREMENTS.md §21 / G4 #34）。
#
# **只有 `main` 与 PR 才跑**：开发期的 `dev` 推送不触发。一张票往往要推 3–5 次，而 Windows 上
# 一次全量门禁 3–4 分钟——迭代期等不起。开发期靠本地门禁兜底（`pnpm check` + windows-target 的
# check/clippy），合入 main 时再让这套 Gate 把全量（含真进程集成测试）跑一遍。
#
# 需要在 dev 上临时验证：`gh workflow run ci.yml --ref dev`（workflow_dispatch）。
#
# `check` 跑仓库的单一本地门禁 `pnpm check`：Rust fmt/clippy/test + 前端 lint/tsc/vitest +
# 四道校验（i18n 中文字面量、i18n key 结构一致、git check-ignore 保真度、specta 生成物无 diff）
# + 前端许可审计。
# `licenses` 单独跑 Rust 许可审计（cargo-deny），与平台无关。
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: windows-latest
    # 兜底：门禁正常 3–4 分钟。挂住时要在 20 分钟内失败并留下日志，而不是耗到 6 小时的默认上限。
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # 长路径（§21）：Windows 上 Rust 目标目录很容易超过 MAX_PATH。
      - name: Enable git long paths
        run: git config --global core.longpaths true

      - uses: pnpm/action-setup@v4
        with:
          version: 12.4.2

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          cache-on-failure: true

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      # Tauri 的构建脚本要求两类产物到位，否则编 src-tauri 会失败：
      # - `frontendDist`（`../dist`）：`generate_context!` 要它存在；
      # - `externalBin` 的 sidecar（`binaries/ageminal-*`）：构建脚本校验资源路径。
      # 干净检出两样都没有，所以先各出一份。
      - name: Build sidecars
        run: pnpm sidecars

      - name: Build frontend
        run: pnpm build

      - name: Gates (rust + frontend + four checks + npm licenses)
        run: pnpm check

  licenses:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check licenses
