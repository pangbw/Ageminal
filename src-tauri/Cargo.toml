[package]
name = "ageminal-desktop"
version.workspace = true
description = "Ageminal 桌面应用（Tauri 2 壳 + app-core）"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
# 本 crate 还有一个 codegen bin（export_bindings，需 bindgen feature）；指定 dev 跑主的那个。
default-run = "ageminal-desktop"

[lib]
name = "ageminal_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# 仅供本地生成 TypeScript 绑定使用；默认关闭，避免被打进安装包。
bindgen = []

[[bin]]
name = "export_bindings"
path = "src/bin/export_bindings.rs"
required-features = ["bindgen"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
ageminal-agent = { path = "../crates/agent" }
ageminal-daemon = { path = "../crates/daemon" }
ageminal-files = { path = "../crates/files" }
ageminal-git = { path = "../crates/git" }
ageminal-protocol = { path = "../crates/protocol" }
ageminal-workspace = { path = "../crates/workspace" }
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
# Rust ↔ TS 类型边界。specta 生态尚在 beta，必须用 `=` 钉死版本。
specta = { version = "=2.0.0-rc.25", features = ["derive"] }
specta-typescript = "0.0.12"
tauri-specta = { version = "=2.0.0-rc.25", features = ["typescript"] }
tauri-plugin-os = "2.0.0-rc.1"
tauri-plugin-notification = "2"
# 目录选择器（#32 D1）；**只从 Rust 侧调用**（D3），capabilities 不放开给它。
tauri-plugin-dialog = "2"
# 外部打开（#60 D6 #20）；同样只从 Rust 侧调用，capabilities 不放开 plugin:opener。
tauri-plugin-opener = "2"
tauri-plugin-clipboard-manager = "2"
sysinfo = "0.39.6"

[target."cfg(windows)".dependencies]
clipboard-win = "5.4.1"
