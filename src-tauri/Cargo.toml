[package]
name = "ageminal-desktop"
version.workspace = true
description = "Ageminal 桌面应用（Tauri 2 壳 + app-core）"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
# 本 crate 还有 export_bindings（绑定生成）；指定 tauri dev 默认跑主的那个。
default-run = "ageminal-desktop"

[lib]
name = "ageminal_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
# Rust ↔ TS 类型边界。specta 生态尚在 beta，必须用 `=` 钉死版本。
specta = { version = "=2.0.0-rc.25", features = ["derive"] }
specta-typescript = "0.0.12"
tauri-specta = { version = "=2.0.0-rc.25", features = ["typescript"] }
