[package]
name = "ageminal-desktop"
version.workspace = true
description = "Ageminal 桌面应用（Tauri 2 壳 + app-core）"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
# 本 crate 还有一个 codegen bin（export_bindings，需 bindgen feature）；指定 dev 跑主的那个。
default-run = "ageminal-desktop"

[lib]
name = "ageminal_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# 仅供本地生成 TypeScript 绑定使用；默认关闭，避免被打进安装包。
bindgen = []

[[bin]]
name = "export_bindings"
path = "src/bin/export_bindings.rs"
required-features = ["bindgen"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
# Rust ↔ TS 类型边界。specta 生态尚在 beta，必须用 `=` 钉死版本。
specta = { version = "=2.0.0-rc.25", features = ["derive"] }
specta-typescript = "0.0.12"
tauri-specta = { version = "=2.0.0-rc.25", features = ["typescript"] }
tauri-plugin-os = "2.0.0-rc.1"
