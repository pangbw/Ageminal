# 依赖许可审计（#63 / REQUIREMENTS.md §20）：**白名单制**。
#
# 只有下面列出的宽松 / 弱著佐权许可被接受；**GPL / AGPL / SSPL 以及任何未知许可**都会因不在
# 白名单里而被拒。CI 的 `licenses` 作业跑 `cargo deny check licenses`，本机可 `cargo deny
# check licenses` 复现。
#
# SPDX 表达式按逻辑求值：`MIT OR Apache-2.0` 命中任一条即可；`(MIT OR Apache-2.0) AND
# Unicode-3.0` 则要求两半都成立——所以 `Unicode-3.0` / `Unicode-DFS-2016` 也在白名单里。
[licenses]
allow = [
  "0BSD",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "CC0-1.0",
  "ISC",
  "MIT",
  "MIT-0",
  "MPL-2.0",
  "Unicode-3.0",
  "Zlib",
]
confidence-threshold = 0.9
